<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasyaa Official - Panel Hosting</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Panel Hosting</h1>
            <p class="subtitle">Beli panel hosting berkualitas tinggi</p>
        </header>

        <main>
            <div id="form-section" class="card">
                <h2>Pesan Panel</h2>
                <form id="order-form">
                    <div class="form-group">
                        <label for="username">Username Panel</label>
                        <input type="text" id="username" placeholder="username_panel" required>
                        <small>Gunakan huruf kecil, angka, dan underscore (_)</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="ram">Pilihan RAM</label>
                        <select id="ram" required>
                            <option value="1gb">1GB RAM (Rp1.000)</option>
                            <option value="2gb">2GB RAM (Rp2.000)</option>
                            <option value="4gb">4GB RAM (Rp4.000)</option>
                            <option value="8gb">8GB RAM (Rp8.000)</option>
                            <option value="10gb">10GB RAM (Rp10.000)</option>
                            <option value="unli">Unlimited RAM (Rp15.000)</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-primary">Beli Sekarang</button>
                </form>
            </div>

            <div id="payment-section" class="card hidden">
                <h2>Pembayaran</h2>
                <div class="qr-container">
                    <img id="qr-image" src="" alt="QR Code Pembayaran">
                </div>
                
                <div class="payment-info">
                    <div class="info-row">
                        <span>ID Transaksi:</span>
                        <span id="transaction-id">TRX-123456</span>
                    </div>
                    <div class="info-row">
                        <span>Total:</span>
                        <span id="payment-amount">Rp10.000</span>
                    </div>
                    <div class="info-row">
                        <span>Status:</span>
                        <span id="payment-status">Menunggu pembayaran</span>
                    </div>
                </div>
                
                <div class="timer">
                    <span id="countdown">05:00</span> tersisa
                </div>
                
                <button id="cancel-btn" class="btn-secondary">Batalkan</button>
            </div>

            <div id="processing-section" class="card hidden">
                <h2>Memproses Panel Anda</h2>
                <div class="loader"></div>
                <p id="processing-message">Membuat akun panel...</p>
            </div>

            <div id="success-section" class="card hidden">
                <h2>Panel Berhasil Dibuat!</h2>
                <div class="success-icon">✓</div>
                
                <div class="panel-details">
                    <pre id="panel-info"></pre>
                </div>
                
                <button id="copy-btn" class="btn-primary">
                    <span>Salin Data Panel</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
                
                <button id="new-order-btn" class="btn-secondary">Pesan Lagi</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
